name: Feature request
description: Propose a change that fits a single-layout, hardware-specific build
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project intentionally ships one layout (100) for one codec family
        (ALC236). Requests to add other codecs or general-purpose layouts are
        out of scope; send them to upstream AppleALC instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today, on which hardware?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Be specific about layout, pins, scripts or documentation.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Measurements, codec dumps, or upstream references that support the change.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This keeps layout 100 as the only bundled layout
        - label: I have read docs/HARDWARE.md and COMPATIBILITY.md
